<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Orakel Münzwurf</title>
  <meta name="theme-color" content="#050b06">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=MedievalSharp&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    body, html {
      width: 100%; height: 100%; overflow: hidden;
      background: #050b06; font-family: 'Cinzel', serif;
      display: flex; justify-content: center; align-items: center;
    }
    #stage {
      position: relative; width: 100vw; height: 100vh;
      max-width: 460px; max-height: 920px;
      overflow: hidden; box-shadow: 0 0 50px rgba(0,0,0,0.9);
      background: #0a110a;
    }
    #bg-canvas, #particle-canvas {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none;
    }
    .top-bar {
      position: absolute; top: 18px; left: 0; right: 0;
      display: flex; justify-content: space-between; align-items: center;
      padding: 0 16px; z-index: 20; pointer-events: none;
    }
    .counters { display: flex; gap: 12px; pointer-events: auto; }
    .stone-plate {
      position: relative;
      background: linear-gradient(135deg, #3d3b36 0%, #222220 50%, #161614 100%);
      border: 2px solid #5d5648; border-radius: 9px;
      padding: 6px 14px; display: flex; align-items: center; gap: 6px;
      box-shadow: 0 6px 14px rgba(0,0,0,0.8), inset 0 1px 2px rgba(255,255,255,0.2), inset 0 -2px 4px rgba(0,0,0,0.7);
    }
    .stone-plate::before, .stone-plate::after {
      content: ''; position: absolute; width: 6px; height: 6px;
      border: 1px solid #948259; transform: rotate(45deg); background: #2a251d;
    }
    .stone-plate::before { top: -4px; left: -4px; }
    .stone-plate::after { bottom: -4px; right: -4px; }
    .plate-label {
      font-size: 13px; font-weight: 800; letter-spacing: 1px;
      color: #dfd7c2; text-shadow: 0 1px 2px #000;
    }
    .plate-value {
      font-size: 15px; font-weight: 900;
      color: #ffd875; text-shadow: 0 0 8px rgba(255,216,117,0.5), 0 2px 2px #000;
    }
    .audio-btn {
      pointer-events: auto; width: 38px; height: 38px; border-radius: 50%;
      background: linear-gradient(135deg, #38342d, #1c1a16);
      border: 2px solid #6b5c3e; color: #dfd7c2;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.7);
    }
    .audio-btn svg { width: 18px; height: 18px; fill: currentColor; }
    .audio-btn.muted { opacity: 0.45; }
    #coin-viewport {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      display: flex; justify-content: center; align-items: center;
      perspective: 1000px; z-index: 10;
    }
    #coin-shadow {
      position: absolute; width: 220px; height: 45px;
      background: radial-gradient(ellipse at center, rgba(0,0,0,0.75) 0%, rgba(0,0,0,0) 70%);
      transform: translateY(125px); pointer-events: none; transition: transform 0.05s linear;
    }
    #coin-anchor {
      position: relative; width: 250px; height: 250px;
      transform-style: preserve-3d; will-change: transform;
      cursor: pointer;
    }
    #coin-canvas {
      position: absolute; top: 0; left: 0; width: 250px; height: 250px;
      border-radius: 50%;
    }
    .bottom-bar {
      position: absolute; bottom: 32px; left: 0; right: 0;
      display: flex; flex-direction: column; align-items: center;
      z-index: 20; padding: 0 20px; gap: 14px;
    }
    #message-overlay {
      position: absolute; top: 22%; left: 0; right: 0;
      text-align: center; z-index: 25; pointer-events: none;
      opacity: 0; transform: translateY(20px); transition: opacity 0.5s ease, transform 0.5s ease;
    }
    .main-msg {
      font-size: 20px; font-weight: 800; letter-spacing: 2px;
      text-transform: uppercase; text-shadow: 0 2px 6px #000;
    }
    .sub-msg { font-family: 'MedievalSharp', serif; font-size: 16px; color: #dfd7c2; margin-top: 6px; text-shadow: 0 2px 4px #000; }
    #toss-btn {
      position: relative; width: 85%; max-width: 310px; height: 60px;
      background: linear-gradient(180deg, #443e34 0%, #2d2820 40%, #1e1b15 100%);
      border: 3px solid #826f49; border-radius: 12px;
      display: flex; justify-content: center; align-items: center;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(0,0,0,0.9), inset 0 2px 3px rgba(255,230,170,0.35), inset 0 -3px 6px rgba(0,0,0,0.9);
      transition: transform 0.1s ease, filter 0.2s;
    }
    #toss-btn:active { transform: scale(0.97); }
    #toss-btn.disabled { opacity: 0.6; pointer-events: none; filter: grayscale(0.5); }
    .btn-text {
      font-size: 19px; font-weight: 900; letter-spacing: 2px;
      background: linear-gradient(180deg, #fff3cb 0%, #d8b868 60%, #876829 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    }
    .hint-label {
      font-size: 11px; letter-spacing: 1px; color: #879282; opacity: 0.7;
    }
  </style>
</head>
<body>
  <div id="stage">
    <canvas id="bg-canvas"></canvas>
    <canvas id="particle-canvas"></canvas>
    
    <div id="message-overlay">
      <div class="main-msg" id="main-msg"></div>
      <div class="sub-msg" id="sub-msg"></div>
    </div>

    <div class="top-bar">
      <div class="counters">
        <div class="stone-plate" id="plate-ja">
          <span class="plate-label">JA:</span>
          <span class="plate-value" id="val-ja">0</span>
        </div>
        <div class="stone-plate" id="plate-nein">
          <span class="plate-label">NEIN:</span>
          <span class="plate-value" id="val-nein">0</span>
        </div>
      </div>
      <button class="audio-btn" id="audio-toggle" aria-label="Audio">
        <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
      </button>
    </div>

    <div id="coin-viewport">
      <div id="coin-shadow"></div>
      <div id="coin-anchor">
        <canvas id="coin-canvas" width="500" height="500"></canvas>
      </div>
    </div>

    <div class="bottom-bar">
      <div id="toss-btn">
        <span class="btn-text">MÜNZE WERFEN</span>
      </div>
      <span class="hint-label">Tippe auf den Button oder die Münze</span>
    </div>
  </div>

  <script>
    let soundEnabled = true;
    let jaCount = 0;
    let neinCount = 0;
    let isFlipping = false;
    let currentSide = 'JA';

    const valJa = document.getElementById('val-ja');
    const valNein = document.getElementById('val-nein');
    const tossBtn = document.getElementById('toss-btn');
    const coinAnchor = document.getElementById('coin-anchor');
    const coinShadow = document.getElementById('coin-shadow');
    const coinCanvas = document.getElementById('coin-canvas');
    const coinCtx = coinCanvas.getContext('2d');
    const bgCanvas = document.getElementById('bg-canvas');
    const bgCtx = bgCanvas.getContext('2d');
    const pCanvas = document.getElementById('particle-canvas');
    const pCtx = pCanvas.getContext('2d');
    const audioBtn = document.getElementById('audio-toggle');
    const messageOverlay = document.getElementById('message-overlay');
    const mainMsg = document.getElementById('main-msg');
    const subMsg = document.getElementById('sub-msg');

    audioBtn.addEventListener('click', () => {
      soundEnabled = !soundEnabled;
      audioBtn.classList.toggle('muted', !soundEnabled);
    });

    function playSound(type) {
      if (!soundEnabled || typeof Tone === 'undefined') return;
      try {
        if (Tone.context.state !== 'running') Tone.start();
        if (type === 'flip') {
          const osc = new Tone.Oscillator(1400, "sine").toDestination();
          osc.volume.value = -14; osc.start(); osc.stop("+0.07");
        } else if (type === 'ja') {
          const synth = new Tone.PolySynth(Tone.Synth).toDestination();
          synth.set({
            oscillator: { type: "sine" },
            envelope: { attack: 0.08, decay: 0.3, sustain: 0.6, release: 1.8 }
          });
          synth.volume.value = -8;
          synth.triggerAttackRelease(["C4", "E4", "G4", "C5"], "2n");
        } else if (type === 'nein') {
          const synth = new Tone.PolySynth(Tone.Synth).toDestination();
          synth.set({
            oscillator: { type: "triangle" },
            envelope: { attack: 0.1, decay: 0.4, sustain: 0.5, release: 1.6 }
          });
          synth.volume.value = -8;
          synth.triggerAttackRelease(["C3", "G3", "Eb4"], "2n");
        }
      } catch (e) {}
    }

    function showMessage(isJa) {
      mainMsg.textContent = isJa ? "Die Götter haben entschieden" : "Das Schicksal hat gesprochen";
      subMsg.textContent = isJa ? "Die Antwort lautet: JA" : "Die Antwort lautet: NEIN";
      mainMsg.style.color = isJa ? "#1fe56c" : "#ff505a";
      messageOverlay.style.opacity = '1';
      messageOverlay.style.transform = 'translateY(0)';
      setTimeout(() => {
        messageOverlay.style.opacity = '0';
        messageOverlay.style.transform = 'translateY(20px)';
      }, 3200);
    }

    function resizeCanvases() {
      const rect = document.getElementById('stage').getBoundingClientRect();
      bgCanvas.width = rect.width; bgCanvas.height = rect.height;
      pCanvas.width = rect.width; pCanvas.height = rect.height;
      drawBackground();
    }
    window.addEventListener('resize', resizeCanvases);

    function drawBackground() {
      const w = bgCanvas.width, h = bgCanvas.height;
      const g = bgCtx.createRadialGradient(w * 0.5, h * 0.35, 10, w * 0.5, h * 0.4, w * 0.85);
      g.addColorStop(0, '#2d4529');
      g.addColorStop(0.3, '#18291a');
      g.addColorStop(0.7, '#0c160e');
      g.addColorStop(1, '#050b06');
      bgCtx.fillStyle = g;
      bgCtx.fillRect(0, 0, w, h);

      bgCtx.save();
      bgCtx.globalAlpha = 0.08;
      bgCtx.fillStyle = '#fffae0';
      for (let i = 0; i < 4; i++) {
        bgCtx.beginPath();
        bgCtx.moveTo(w * 0.5 - 40 + i * 25, 0);
        bgCtx.lineTo(w * 0.1 + i * 80, h);
        bgCtx.lineTo(w * 0.35 + i * 90, h);
        bgCtx.closePath();
        bgCtx.fill();
      }
      bgCtx.restore();
    }

    let particles = [];
    for (let i = 0; i < 28; i++) {
      particles.push({
        x: Math.random() * 400, y: Math.random() * 700,
        vx: (Math.random() - 0.5) * 0.3, vy: -0.2 - Math.random() * 0.3,
        r: 1 + Math.random() * 2, a: Math.random(),
        color: Math.random() > 0.4 ? 'rgba(255,225,120,' : 'rgba(120,255,160,'
      });
    }

    function createBurst(isGreen) {
      const cx = pCanvas.width / 2, cy = pCanvas.height / 2;
      const rgb = isGreen ? '90,255,160' : '255,80,90';
      for (let i = 0; i < 40; i++) {
        const ang = Math.random() * Math.PI * 2;
        const speed = 2 + Math.random() * 6;
        particles.push({
          x: cx, y: cy,
          vx: Math.cos(ang) * speed, vy: Math.sin(ang) * speed,
          r: 2 + Math.random() * 3, a: 1,
          color: `rgba(${rgb},`, burst: true
        });
      }
    }

    function updateParticles() {
      pCtx.clearRect(0, 0, pCanvas.width, pCanvas.height);
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx; p.y += p.vy;
        if (p.burst) {
          p.a -= 0.02; p.r *= 0.97;
          if (p.a <= 0) { particles.splice(i, 1); continue; }
        } else {
          if (p.y < 0) { p.y = pCanvas.height + 10; p.x = Math.random() * pCanvas.width; }
          p.a = 0.3 + 0.5 * Math.sin(Date.now() * 0.003 + p.x);
        }
        pCtx.beginPath();
        pCtx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        pCtx.fillStyle = p.color + p.a + ')';
        pCtx.fill();
      }
      requestAnimationFrame(updateParticles);
    }

    function renderCoinFace(side) {
      const w = 500, h = 500, cx = 250, cy = 250, r = 230;
      coinCtx.clearRect(0, 0, w, h);

      const edgeGrad = coinCtx.createRadialGradient(cx - 30, cy - 30, 180, cx, cy, r);
      edgeGrad.addColorStop(0, '#d1ab5a');
      edgeGrad.addColorStop(0.85, '#6a4e21');
      edgeGrad.addColorStop(1, '#3b280c');
      coinCtx.beginPath();
      coinCtx.arc(cx, cy, r, 0, Math.PI * 2);
      coinCtx.fillStyle = edgeGrad;
      coinCtx.fill();

      coinCtx.strokeStyle = '#2b1b07';
      coinCtx.lineWidth = 4;
      for (let a = 0; a < Math.PI * 2; a += Math.PI / 36) {
        coinCtx.beginPath();
        coinCtx.moveTo(cx + Math.cos(a) * (r - 12), cy + Math.sin(a) * (r - 12));
        coinCtx.lineTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r);
        coinCtx.stroke();
      }

      const plateGrad = coinCtx.createRadialGradient(cx - 40, cy - 50, 20, cx, cy, r - 16);
      plateGrad.addColorStop(0, '#f9df88');
      plateGrad.addColorStop(0.5, '#ba903e');
      plateGrad.addColorStop(0.85, '#6f4f1a');
      plateGrad.addColorStop(1, '#38250a');
      coinCtx.beginPath();
      coinCtx.arc(cx, cy, r - 16, 0, Math.PI * 2);
      coinCtx.fillStyle = plateGrad;
      coinCtx.fill();
      coinCtx.lineWidth = 4;
      coinCtx.strokeStyle = '#ffe494';
      coinCtx.stroke();

      coinCtx.beginPath();
      coinCtx.arc(cx, cy, r - 52, 0, Math.PI * 2);
      coinCtx.lineWidth = 3;
      coinCtx.strokeStyle = '#4e3612';
      coinCtx.stroke();

      const numGems = 8;
      const gemRadius = r - 34;
      const isJa = (side === 'JA');
      for (let i = 0; i < numGems; i++) {
        const ang = (i / numGems) * Math.PI * 2 - Math.PI / 2;
        const gx = cx + Math.cos(ang) * gemRadius;
        const gy = cy + Math.sin(ang) * gemRadius;

        coinCtx.beginPath();
        coinCtx.arc(gx, gy, 12, 0, Math.PI * 2);
        coinCtx.fillStyle = '#261b0c';
        coinCtx.fill();

        coinCtx.save();
        coinCtx.translate(gx, gy);
        coinCtx.rotate(ang + Math.PI / 4);
        coinCtx.beginPath();
        coinCtx.rect(-7, -7, 14, 14);
        const gGrad = coinCtx.createLinearGradient(-7, -7, 7, 7);
        if (isJa) {
          gGrad.addColorStop(0, '#c7ffda');
          gGrad.addColorStop(0.4, '#1fe56c');
          gGrad.addColorStop(1, '#066329');
        } else {
          gGrad.addColorStop(0, '#ffb8b8');
          gGrad.addColorStop(0.4, '#f01a37');
          gGrad.addColorStop(1, '#660511');
        }
        coinCtx.fillStyle = gGrad;
        coinCtx.fill();
        coinCtx.lineWidth = 1.5;
        coinCtx.strokeStyle = isJa ? '#7affb0' : '#ff7a8a';
        coinCtx.stroke();
        coinCtx.restore();
      }

      coinCtx.save();
      coinCtx.font = '900 115px "MedievalSharp", "Cinzel", serif';
      coinCtx.textAlign = 'center';
      coinCtx.textBaseline = 'middle';

      coinCtx.fillStyle = '#2b1b07';
      coinCtx.fillText(side, cx + 4, cy + 9);

      const textGrad = coinCtx.createLinearGradient(cx, cy - 60, cx, cy + 60);
      textGrad.addColorStop(0, '#fff6d4');
      textGrad.addColorStop(0.4, '#ffd777');
      textGrad.addColorStop(0.8, '#c29231');
      textGrad.addColorStop(1, '#6b4c13');
      coinCtx.fillStyle = textGrad;
      coinCtx.fillText(side, cx, cy + 4);

      coinCtx.lineWidth = 2.5;
      coinCtx.strokeStyle = '#fff0ba';
      coinCtx.strokeText(side, cx, cy + 4);
      coinCtx.restore();
    }

    function flipCoin() {
      if (isFlipping) return;
      isFlipping = true;
      tossBtn.classList.add('disabled');
      playSound('flip');

      const outcome = Math.random() < 0.5 ? 'JA' : 'NEIN';
      const totalRotations = 10;
      const duration = 2100;
      const startTime = performance.now();

      function animate(now) {
        const elapsed = now - startTime;
        const p = Math.min(elapsed / duration, 1);
        const easeOut = 1 - Math.pow(1 - p, 3);

        const currentRot = easeOut * totalRotations * Math.PI;
        const currentY = -Math.sin(p * Math.PI) * 220;
        const scale = 1 + Math.sin(p * Math.PI) * 0.25;

        const faceRotMod = (currentRot % (Math.PI * 2));
        const showFace = (faceRotMod > Math.PI / 2 && faceRotMod < (Math.PI * 1.5)) ?
          (outcome === 'JA' ? 'NEIN' : 'JA') : outcome;

        renderCoinFace(showFace);

        coinAnchor.style.transform = `translateY(${currentY}px) rotateX(${currentRot}rad) scale(${scale})`;
        const shadowScale = 1 - Math.sin(p * Math.PI) * 0.5;
        const shadowAlpha = 0.7 - Math.sin(p * Math.PI) * 0.45;
        coinShadow.style.transform = `translateY(125px) scale(${shadowScale})`;
        coinShadow.style.opacity = shadowAlpha;

        if (p < 1) {
          requestAnimationFrame(animate);
        } else {
          currentSide = outcome;
          renderCoinFace(outcome);
          coinAnchor.style.transform = 'translateY(0px) rotateX(0rad) scale(1)';
          coinShadow.style.transform = 'translateY(125px) scale(1)';
          coinShadow.style.opacity = 0.7;

          if (outcome === 'JA') {
            jaCount++;
            valJa.textContent = jaCount;
            playSound('ja');
            createBurst(true);
            showMessage(true);
          } else {
            neinCount++;
            valNein.textContent = neinCount;
            playSound('nein');
            createBurst(false);
            showMessage(false);
          }

          isFlipping = false;
          tossBtn.classList.remove('disabled');
        }
      }
      requestAnimationFrame(animate);
    }

    tossBtn.addEventListener('click', flipCoin);
    coinAnchor.addEventListener('click', flipCoin);

    resizeCanvases();
    renderCoinFace('JA');
    requestAnimationFrame(updateParticles);
  </script>
</body>
</html>
